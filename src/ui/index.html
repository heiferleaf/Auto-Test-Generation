<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>可视化蒙版 · 自动化测试控制台</title>
  <style>
    /* 控制台样式骨架：供 UI 设计师在此外观基础上重构，不绑定业务逻辑。 */
    :root {
      --bg: #1e1e2e; --panel: #27293d; --line: #3a3d57;
      --text: #e6e6f0; --muted: #9a9cb8; --accent: #6c8cff; --ok: #4ec9a8; --warn: #e5c07b;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); }
    #app { display: flex; flex-direction: column; height: 100vh; }

    .ui-shell-header {
      display: flex; align-items: center; gap: 12px; padding: 10px 16px;
      background: var(--panel); border-bottom: 1px solid var(--line); font-size: 14px;
    }
    .ui-shell-header .badge { color: var(--muted); font-size: 12px; }
    .ui-shell-header .rec-dot { width: 9px; height: 9px; border-radius: 50%; background: #555; }
    .ui-shell-header .rec-dot.on { background: #ff5f56; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

    .ui-shell-body { flex: 1; display: flex; min-height: 0; }

    /* 中间：被测软件视图（截图流 + 高亮层叠加） */
    .ui-shell-stage {
      position: relative; flex: 1; margin: 12px; border: 1px solid var(--line);
      border-radius: 8px; overflow: hidden; background: #11111b;
      display: flex; align-items: center; justify-content: center;
    }
    .ui-shell-frame {
      width: 100%; height: 100%; color: var(--muted); font-size: 13px;
      display: flex; align-items: center; justify-content: center; text-align: center; padding: 20px;
    }
    .ui-shell-highlight {
      position: absolute; border: 2px solid var(--accent); background: rgba(108,140,255,.15);
      pointer-events: none; transition: all .15s ease; border-radius: 3px;
    }

    /* 侧边：步骤列表（用户友好形式） */
    .ui-shell-steps {
      width: 340px; border-left: 1px solid var(--line); background: var(--panel);
      display: flex; flex-direction: column; min-height: 0;
    }
    .ui-shell-steps-title { padding: 10px 14px; font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--line); }
    .ui-shell-steps-list { flex: 1; overflow-y: auto; padding: 8px; }
    .ui-shell-step-item {
      display: flex; align-items: center; gap: 8px; padding: 8px 10px; margin-bottom: 6px;
      background: #2f3147; border: 1px solid transparent; border-radius: 6px; font-size: 13px; cursor: pointer;
    }
    .ui-shell-step-item:hover { border-color: var(--accent); }
    .ui-shell-step-idx { color: var(--muted); width: 20px; text-align: right; flex: none; }
    .ui-shell-step-desc { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* 步骤运行态（R3 运行全部）：左侧色条 + 底色区分 pending/running/pass/fail */
    .ui-shell-step-item.is-running { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
    .ui-shell-step-item.is-pass { box-shadow: inset 3px 0 0 #3fb950; }
    .ui-shell-step-item.is-fail { border-color: #f85149; background: #43303a; box-shadow: inset 3px 0 0 #f85149; }

    /* 列表项选中态（R4 双向联动）：与 CFG 节点选中样式呼应，
       点击图节点时列表侧必须有可见反馈（此前缺此规则，属性设了但用户看不见）。 */
    .ui-shell-step-item.is-selected { border-color: var(--accent); background: #1f2b3a; }

    /* 运行中断提醒条 */
    .ui-shell-run-notice {
      margin: 0 16px 10px; padding: 9px 12px; border-radius: 6px; font-size: 13px;
      background: #43303a; border: 1px solid #f85149; color: #ffb4ae;
    }

    /* 高亮占位框（坐标未到位时的即时反馈，虚线区分） */
    .ui-shell-highlight.is-pending { border-style: dashed; opacity: .6; }

    /* 底部：操作栏 */
    .ui-shell-actions { display: flex; gap: 8px; padding: 10px 16px; background: var(--panel); border-top: 1px solid var(--line); flex-wrap: wrap; }
    .ui-shell-actions button {
      background: #34374f; color: var(--text); border: 1px solid var(--line); border-radius: 6px;
      padding: 7px 14px; font-size: 13px; cursor: pointer;
    }
    .ui-shell-actions button:hover { border-color: var(--accent); }
    .ui-shell-actions button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .ui-shell-actions button.danger { color: #ff8b82; }

    /* CFG 图形化视图（M3-R4）：控制流图 */
    .ui-shell-cfg {
      width: 300px; border-left: 1px solid var(--line); background: var(--panel);
      display: flex; flex-direction: column; min-height: 0; overflow-y: auto; padding: 10px;
    }
    .ui-shell-cfg-empty { color: var(--muted); font-size: 13px; padding: 12px; text-align: center; }
    .ui-shell-cfg-tree { display: flex; flex-direction: column; gap: 8px; }

    /* 竖向顺序排列（顺序组/顶层） */
    .ui-shell-cfg-node {
      display: flex; flex-direction: column; gap: 4px; padding: 7px 10px;
      background: #2f3147; border: 1px solid transparent; border-radius: 6px; font-size: 13px; cursor: pointer;
    }
    .ui-shell-cfg-node:hover { border-color: var(--accent); }
    .ui-shell-cfg-label { flex: 1; }

    /* 选中态描边（同时只一个） */
    .ui-shell-cfg-node.is-selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
    /* 未知控制结构（运行时脏数据的降级显示）：醒目虚线边，提示数据非法但不白屏 */
    .ui-shell-cfg-node.is-unknown { border-style: dashed; border-color: #d29922; }

    /* 节点运行态色（与列表同语：running 蓝 / pass 绿 / fail 红） */
    .ui-shell-cfg-node.is-running { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
    .ui-shell-cfg-node.is-pass { box-shadow: inset 3px 0 0 #3fb950; }
    .ui-shell-cfg-node.is-fail { border-color: #f85149; background: #43303a; box-shadow: inset 3px 0 0 #f85149; }

    /* if 两枝并排分叉 */
    .ui-shell-cfg-branch { margin: 4px 0 4px 14px; padding: 4px; border-radius: 5px; display: flex; flex-direction: column; gap: 4px; }
    .ui-shell-cfg-branch-true { border-left: 2px solid #3fb950; }
    .ui-shell-cfg-branch-false { border-left: 2px solid #f85149; }

    /* while 回环：循环体缩进 + 回环标记 */
    .ui-shell-cfg-loop-mark { color: var(--accent); font-weight: bold; }
    .ui-shell-cfg-while-body { margin: 4px 0 4px 14px; padding-left: 8px; border-left: 2px dashed var(--accent); display: flex; flex-direction: column; gap: 4px; }
    .ui-shell-cfg-seq-body { margin: 4px 0 4px 14px; padding-left: 8px; border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <!-- 浏览器入口：实例化 UiShell 并绑定交互（演示模式下用 mock 内核） -->
  <script type="module" src="./app.js"></script>
</body>
</html>
